[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-secure-toolkit"
version = "0.1.0"
description = "Secure password, token, API key and OTP generators for Python"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name"}
]

[project.scripts]
secure = "secure_toolkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]